<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Coin Basketball - Gestión de Equipo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .court-bg {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .tab-pane {
            display: none !important;
        }
        .tab-pane.active-pane {
            display: block !important;
        }
        body.is-spectator .player-only {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-orange-500 selection:text-white is-spectator">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 border-b border-slate-800 glass-panel shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('roster')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white shadow-lg shadow-orange-500/30">
                    <i class="fa-solid fa-basketball text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white uppercase flex items-center gap-2">
                        ONE COIN <span class="text-xs px-2 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30">BASKETBALL</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 font-medium">Panel de Control & Valoración de Jugadores</p>
                </div>
            </div>

            <!-- Active User Profile, Role Badge & Cloud Indicator -->
            <div class="flex items-center gap-3">
                <div id="role-badge" class="flex items-center gap-1.5 bg-slate-800 text-slate-300 border border-slate-700 px-3 py-1 rounded-full text-xs font-bold">
                    <i class="fa-solid fa-eye text-amber-400"></i>
                    <span id="role-text">Modo Público</span>
                </div>

                <div class="player-only flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full shadow-inner">
                    <img id="active-user-avatar" src="https://placehold.co/100x100/1e293b/f97316?text=User" class="w-6 h-6 rounded-full object-cover border border-orange-500">
                    <select id="active-user-select" onchange="changeActiveUser(this.value)" class="bg-transparent text-xs font-bold text-slate-200 outline-none cursor-pointer">
                        <option value="">Seleccionar Identidad...</option>
                    </select>
                </div>

                <!-- Botón de Iniciar Sesión / Cerrar Sesión -->
                <button type="button" id="btn-auth" onclick="toggleAuthModal()" class="bg-slate-800 hover:bg-slate-700 text-orange-400 border border-orange-500/40 font-extrabold text-xs px-3.5 py-2 rounded-xl shadow-lg flex items-center gap-2 transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-key"></i> <span id="btn-auth-text">Soy Jugador</span>
                </button>

                <!-- EXCLUSIVO DE JUGADORES: Botón de Invitar -->
                <button type="button" onclick="openInviteModal()" class="player-only bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-xs px-3.5 py-2 rounded-xl shadow-lg shadow-orange-500/20 flex items-center gap-2 transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-user-plus"></i> <span class="hidden md:inline">Invitar Jugadores</span>
                </button>
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <nav class="flex border-t border-slate-800/80 max-w-7xl mx-auto px-4 overflow-x-auto scrollbar-none text-xs font-bold">
            <button type="button" onclick="switchTab('roster')" id="tab-roster" class="tab-btn px-4 py-3 text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap transition-colors cursor-pointer">
                <i class="fa-solid fa-users"></i> Plantilla (Roster)
            </button>
            <button type="button" onclick="switchTab('matches')" id="tab-matches" class="tab-btn px-4 py-3 text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap transition-colors cursor-pointer">
                <i class="fa-solid fa-calendar-days"></i> Partidos & Asistencia
            </button>
            <button type="button" onclick="switchTab('ratings')" id="tab-ratings" class="tab-btn px-4 py-3 text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap transition-colors cursor-pointer">
                <i class="fa-solid fa-star"></i> Valoraciones & Stats (1-10)
            </button>
            <button type="button" onclick="switchTab('tactics')" id="tab-tactics" class="tab-btn px-4 py-3 text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap transition-colors cursor-pointer">
                <i class="fa-solid fa-chess-board"></i> Pizarra Táctica (2-3)
            </button>
            <button type="button" onclick="switchTab('register')" id="tab-register" class="player-only tab-btn px-4 py-3 text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap transition-colors cursor-pointer">
                <i class="fa-solid fa-user-plus"></i> Registro
            </button>
        </nav>
    </header>

    <!-- SEASON METRICS BANNER -->
    <section class="bg-slate-900/90 border-b border-slate-800/80 py-2.5">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-3 text-center text-xs">
            <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                <span class="text-slate-400 text-[10px] uppercase font-bold block">Récord Temporada</span>
                <span id="stat-record" class="text-white font-black text-sm">0V - 0D</span>
            </div>
            <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                <span class="text-slate-400 text-[10px] uppercase font-bold block">Racha Actual</span>
                <span id="stat-streak" class="text-amber-400 font-black text-sm">--</span>
            </div>
            <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                <span class="text-slate-400 text-[10px] uppercase font-bold block">Máximo Anotador</span>
                <span id="stat-top-scorer" class="text-emerald-400 font-black text-sm line-clamp-1">--</span>
            </div>
            <div class="bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                <span class="text-slate-400 text-[10px] uppercase font-bold block">Mejor Valorado (MVP)</span>
                <span id="stat-mvp" class="text-orange-400 font-black text-sm line-clamp-1">--</span>
            </div>
        </div>
    </section>

    <!-- MAIN CONTENT CONTAINERS -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- TAB 1: PLANTILLA / ROSTER -->
        <section id="view-roster" class="tab-pane active-pane space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                <div>
                    <h2 class="text-lg font-black text-white flex items-center gap-2">
                        <span>Jugadores de One Coin</span>
                        <span id="player-count-badge" class="bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                    </h2>
                    <p class="text-xs text-slate-400">Haz clic en "Ver Tarjeta y Perfil" para consultar o editar tus datos</p>
                </div>
                <div class="flex flex-wrap gap-1.5">
                    <button type="button" onclick="filterPosition('All')" data-pos="All" class="pos-filter-btn px-3 py-1.5 rounded-lg bg-orange-600 text-white
